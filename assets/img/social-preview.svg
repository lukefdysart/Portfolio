<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fc"/>
      <stop offset="1" stop-color="#eef1f8"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="20%" cy="26%" r="55%">
      <stop offset="0" stop-color="rgba(199,150,47,0.20)"/>
      <stop offset="1" stop-color="rgba(199,150,47,0)"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="78%" cy="68%" r="55%">
      <stop offset="0" stop-color="rgba(123,92,196,0.18)"/>
      <stop offset="1" stop-color="rgba(123,92,196,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <rect width="1200" height="630" fill="url(#glowPurple)"/>
  <!-- subtle grid -->
  <g stroke="#dce1ec" stroke-width="1" opacity="0.7">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200 M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <!-- eyebrow -->
  <text x="80" y="150" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="23"
        letter-spacing="3" font-weight="600" fill="#3b6fd4">
    ECE &amp; BME · VANDERBILT UNIVERSITY
  </text>
  <!-- name -->
  <text x="78" y="268" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="92"
        font-weight="700" letter-spacing="-2" fill="#1b2230">LUKE DYSART</text>
  <!-- headline -->
  <text x="80" y="372" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52"
        font-weight="500"><tspan fill="#c7962f" font-weight="700">Imagination,</tspan></text>
  <text x="80" y="440" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52"
        font-weight="500" fill="#566073">engineered.</text>
  <!-- project chips -->
  <g font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="500">
    <rect x="80"  y="500" width="220" height="54" rx="27" fill="#ffffff" stroke="#dce1ec"/>
    <text x="190" y="535" text-anchor="middle" fill="#1b2230">Confidential R&amp;D</text>
    <rect x="320" y="500" width="240" height="54" rx="27" fill="#ffffff" stroke="#dce1ec"/>
    <text x="440" y="535" text-anchor="middle" fill="#1b2230">Project MIMIC</text>
    <rect x="580" y="500" width="290" height="54" rx="27" fill="#ffffff" stroke="#dce1ec"/>
    <text x="725" y="535" text-anchor="middle" fill="#1b2230">Stories Illuminated</text>
  </g>
  <!-- LD mark top-right -->
  <rect x="1020" y="70" width="110" height="110" rx="24" fill="#c7962f"/>
  <text x="1075" y="146" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif"
        font-size="56" font-weight="700" fill="#ffffff">LD</text>
</svg>
