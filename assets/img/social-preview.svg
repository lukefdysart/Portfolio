<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151f"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="30%" r="60%">
      <stop offset="0" stop-color="rgba(255,120,20,0.28)"/>
      <stop offset="1" stop-color="rgba(255,120,20,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="#262d3a" stroke-width="1" opacity="0.5">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200 M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <!-- eyebrow -->
  <text x="80" y="150" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="23"
        letter-spacing="3" font-weight="600" fill="#ffb86c">
    ECE &amp; BIOMEDICAL ENGINEERING · VANDERBILT UNIVERSITY
  </text>
  <!-- name -->
  <text x="78" y="268" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="92"
        font-weight="700" letter-spacing="-2" fill="#e8ebf0">LUKE DYSART</text>
  <!-- headline -->
  <text x="80" y="372" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52"
        font-weight="500" fill="#9aa3b2">Turning <tspan fill="#ff7814" font-weight="700">imagination</tspan> into</text>
  <text x="80" y="440" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52"
        font-weight="500" fill="#9aa3b2">something tangible.</text>
  <!-- project chips -->
  <g font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="500">
    <rect x="80"  y="500" width="200" height="54" rx="27" fill="#161b26" stroke="#262d3a"/>
    <text x="180" y="535" text-anchor="middle" fill="#e8ebf0">Mary · AR</text>
    <rect x="300" y="500" width="260" height="54" rx="27" fill="#161b26" stroke="#262d3a"/>
    <text x="430" y="535" text-anchor="middle" fill="#e8ebf0">Project MIMIC</text>
    <rect x="580" y="500" width="290" height="54" rx="27" fill="#161b26" stroke="#262d3a"/>
    <text x="725" y="535" text-anchor="middle" fill="#e8ebf0">Stories Illuminated</text>
  </g>
  <!-- LD mark top-right -->
  <rect x="1020" y="70" width="110" height="110" rx="24" fill="#ff7814"/>
  <text x="1075" y="146" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif"
        font-size="56" font-weight="700" fill="#1a0f03">LD</text>
</svg>
