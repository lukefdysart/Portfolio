<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#efeadd"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="22%" cy="26%" r="58%">
      <stop offset="0" stop-color="rgba(201,163,74,0.20)"/>
      <stop offset="1" stop-color="rgba(201,163,74,0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowGold)"/>
  <!-- subtle warm grid -->
  <g stroke="#e0d9c8" stroke-width="1" opacity="0.7">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200 M300 0 V630 M600 0 V630 M900 0 V630"/>
  </g>
  <!-- eyebrow -->
  <text x="80" y="150" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="23"
        letter-spacing="3" font-weight="600" fill="#8b91a0">
    ECE &amp; BME · VANDERBILT UNIVERSITY
  </text>
  <!-- name -->
  <text x="78" y="268" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="92"
        font-weight="700" letter-spacing="-2" fill="#1f1f1f">LUKE DYSART</text>
  <!-- headline -->
  <text x="80" y="372" font-family="Georgia,'Times New Roman',serif" font-size="54"
        font-style="italic" font-weight="700" fill="#c9a34a">Imagination,</text>
  <text x="80" y="442" font-family="Georgia,'Times New Roman',serif" font-size="54"
        font-weight="700" fill="#292d38">engineered.</text>
  <!-- project chips -->
  <g font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="24" font-weight="500">
    <rect x="80"  y="500" width="130" height="54" rx="27" fill="#fbf9f3" stroke="#e0d9c8"/>
    <text x="145" y="535" text-anchor="middle" fill="#292d38">MARY</text>
    <rect x="230" y="500" width="240" height="54" rx="27" fill="#fbf9f3" stroke="#e0d9c8"/>
    <text x="350" y="535" text-anchor="middle" fill="#292d38">Project MIMIC</text>
    <rect x="490" y="500" width="290" height="54" rx="27" fill="#fbf9f3" stroke="#e0d9c8"/>
    <text x="635" y="535" text-anchor="middle" fill="#292d38">Stories Illuminated</text>
  </g>
  <!-- real LD signature mark (the actual logo file), top-right -->
  <image href="ld-monogram.png" xlink:href="ld-monogram.png"
         x="980" y="70" width="150" height="110" preserveAspectRatio="xMidYMid meet"/>
</svg>
